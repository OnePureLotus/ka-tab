name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger

jobs:
  e2e:
    name: E2E – Chrome ${{ matrix.chrome-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Named channels are resolved at runtime by setup-chrome (Chrome for Testing).
        # Numeric versions before 113 are not available in the Chrome for Testing registry.
        chrome-version:
          - 'stable'
          - 'beta'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Install Playwright (Chromium only, for fallback)
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chrome ${{ matrix.chrome-version }}
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ matrix.chrome-version }}
          install-chromedriver: false

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chrome-${{ matrix.chrome-version }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chrome-${{ matrix.chrome-version }}
          path: test-results/
          retention-days: 7
